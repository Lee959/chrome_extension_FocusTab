<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FocusTab Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <div id="scopeWarning" class="scope-warning" style="display:none"></div>
    <div class="header">
      <h1>FocusTab Dashboard</h1>
      <div class="header-actions">
        <div class="date-nav">
          <button id="prevDay">&lt;</button>
          <input type="date" id="datePicker">
          <span id="dateRangeLabel" class="date-range-label"></span>
          <button id="nextDay">&gt;</button>
          <button id="todayBtn">Today</button>
          <div class="view-toggle">
            <button class="view-btn active" data-view="day">Day</button>
            <button class="view-btn" data-view="week">Week</button>
            <button class="view-btn" data-view="month">Month</button>
          </div>
        </div>
        <div class="sync-actions">
          <select id="deviceFilter" class="device-filter">
            <option value="local">This Device</option>
            <option value="all">All Devices</option>
          </select>
          <button id="syncBtn" class="sync-btn">Sync</button>
          <button id="settingsBtn" class="settings-btn">Settings</button>
          <span id="syncStatus" class="sync-status"></span>
        </div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Active Time</div>
        <div class="stat-value" id="totalTime">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Sites Visited</div>
        <div class="stat-value" id="siteCount">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Top Site</div>
        <div class="stat-value" id="topSite">--</div>
      </div>
    </div>

    <div class="section">
      <h2>Time by Site</h2>
      <div id="barChart" class="bar-chart"></div>
      <p id="noData" class="no-data" style="display:none">No browsing data for this day.</p>
      <div id="hiddenDomains" class="hidden-domains"></div>
    </div>

    <div class="section" id="timelineSection">
      <h2>Timeline</h2>
      <div id="timeline" class="timeline"></div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
